# Minimal app stack that joins the Traefik network.
# From this repository:
#   docker compose --env-file .env -f config_examples/whoami.docker-compose.yml up -d
#
# In another project, copy the labels and the external network block.

services:
  whoami:
    image: traefik/whoami:v1.11
    restart: unless-stopped
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN}`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls=true
      - traefik.http.routers.whoami.tls.certresolver=letsencrypt
      - traefik.http.routers.whoami.middlewares=security-headers@docker
      - traefik.http.services.whoami.loadbalancer.server.port=80

networks:
  web:
    external: true
    name: ${DOCKER_NETWORK_NAME:-web}
